##version: '3.8'
services:
  
  # DJANGO - GUNICORN
  backend:
    build:
      context: ./dfrm_be
      dockerfile: Dockerfile
    container_name: dfrm_be
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    expose:
      - "8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Limit each log file to 10 MB
        max-file: "3"   # Keep up to 3 log files
    env_file:
      - stack.env  # Load environment variables from stack.env file
  # NGINX REVERSE PROXY
  nginx_proxy:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"     # HTTP
    depends_on:
      - backend
    volumes:
      - ./static:/usr/share/nginx/html/static
      - ./media:/usr/share/nginx/html/media
      - ./dfrm_fe/dist/dfrm_fe:/usr/share/nginx/html  # Serve Angular build files
      - ./innovate.nginx:/etc/nginx/nginx.conf  # Map the local Nginx config to the container
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: 80
      VIRTUAL_PROTO: http
      LETSENCRYPT_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - stack.env  # Load environment variables from stack.env file
networks:
  proxy:
    external: true
    name: nginx_proxy_default